/* ---------- Markdown (small, escaped) ---------- */
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function inline(s) {
  s = esc(s);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
       .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
       .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
       .replace(/\[([^\]]+)\]\((#[\w-]+)\)/g, '<a href="$2">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + codes[+i] + "</code>");
}
function md(src) {
  const lines = src.replace(/\r/g, "").split("\n");
  const ind = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
  const L = lines.map(l => l.slice(ind));
  let out = [], i = 0;
  while (i < L.length) {
    let line = L[i];
    if (!line.trim()) { i++; continue; }
    let m;
    if (line.trim().startsWith("```")) {
      const buf = []; i++;
      while (i < L.length && !L[i].trim().startsWith("```")) buf.push(L[i++]);
      i++;
      const pad = Math.min(...buf.filter(b => b.trim()).map(b => b.match(/^ */)[0].length), 99);
      out.push("<pre><code>" + esc(buf.map(b => b.slice(pad)).join("\n")) + "</code></pre>");
      continue;
    }
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) {
      const lv = m[1].length >= 3 ? 3 : 2;
      out.push(`<h${lv}>${inline(m[2])}</h${lv}>`); i++; continue;
    }
    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < L.length && /^\s*[-*]\s+/.test(L[i])) items.push("<li>" + inline(L[i++].replace(/^\s*[-*]\s+/, "")) + "</li>");
      out.push("<ul>" + items.join("") + "</ul>"); continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [], start = parseInt(line.trim(), 10);
      while (i < L.length && /^\s*\d+\.\s+/.test(L[i])) {
        items.push("<li>" + inline(L[i++].replace(/^\s*\d+\.\s+/, "")) + "</li>");
        while (i < L.length && !L[i].trim() && L[i + 1] && /^\s*\d+\.\s+/.test(L[i + 1])) i++;
      }
      out.push(`<ol start="${start}">` + items.join("") + "</ol>"); continue;
    }
    if (line.startsWith(">")) {
      const buf = [];
      while (i < L.length && L[i].startsWith(">")) buf.push(L[i++].replace(/^>\s?/, ""));
      out.push("<blockquote>" + inline(buf.join(" ")) + "</blockquote>"); continue;
    }
    const buf = [L[i++].trim()];
    while (i < L.length && L[i].trim() && !/^(#{1,3}\s|```|>|[-*]\s|\d+\.\s)/.test(L[i].trim())) buf.push(L[i++].trim());
    out.push("<p>" + inline(buf.join(" ")) + "</p>");
  }
  return out.join("\n");
}

/* ---------- Architecture diagram ---------- */
const NODE = {
  core: "border-accent/70 bg-accent-soft text-accent",
  store: "border-muted/40 bg-sunken border-b-[3px] rounded-b-2xl",
  ext: "border-dashed border-muted/50 bg-transparent",
  plain: "border-line bg-bg"
};
function nodeHtml(n) {
  const k = n[2] || "plain";
  return `<div class="min-w-0 flex-[1_1_9.5rem] max-w-[15rem] rounded-lg border px-3 py-2.5 text-center ${NODE[k]}">
    <b class="block text-[13.5px] font-semibold leading-snug ${k === "core" ? "text-accent" : "text-ink"}">${esc(n[0])}</b>
    ${n[1] ? `<small class="mt-1 block font-mono text-[10.5px] leading-snug text-muted">${esc(n[1])}</small>` : ""}
  </div>`;
}
function diagram(a) {
  const bs = a.boundaries || (a.boundary ? [a.boundary] : []);
  const link = t => `<div class="grid min-h-[2.1rem] grid-cols-[1fr_auto_1fr]" aria-hidden="true"><span class="col-start-2 w-px justify-self-center bg-muted/50"></span>${t.link ? `<span class="col-start-3 self-center pl-2.5 font-mono text-[10.5px] leading-tight text-muted">${esc(t.link)}</span>` : ""}</div>`;
  let html = "";
  a.tiers.forEach((t, i) => {
    if (i) html += link(t);
    bs.filter(b => b.from === i).forEach(b => { html += `<div class="relative mt-2 flex flex-col rounded-xl border border-dashed border-muted/60 px-2 pb-3 pt-6 sm:px-3"><span class="absolute -top-2 left-3 bg-surface px-1.5 font-mono text-[10px] uppercase tracking-wider text-muted">${esc(b.label)}</span>`; });
    html += `<div class="flex flex-wrap justify-center gap-2">${t.nodes.map(nodeHtml).join("")}</div>`;
    bs.filter(b => b.to === i).forEach(() => { html += `</div>`; });
  });
  const kinds = new Set(a.tiers.flatMap(t => t.nodes.map(n => n[2] || "plain")));
  const legend = [["core", "Built by me"], ["plain", "Platform component"], ["store", "Data store"], ["ext", "Outside the system"]]
    .filter(k => kinds.has(k[0])).map(k => `<span class="inline-flex items-center gap-1.5"><i class="inline-block h-2.5 w-3.5 rounded-sm border ${NODE[k[0]]}"></i>${k[1]}</span>`).join("");
  const desc = a.tiers.map(t => t.nodes.map(n => n[0]).join(", ")).join(", then ");
  return `<figure class="card p-4 sm:p-6"><div role="img" aria-label="Architecture, top to bottom: ${esc(desc)}" class="flex flex-col">${html}</div>
    <figcaption class="mt-5 flex flex-wrap gap-x-5 gap-y-1.5 border-t border-line pt-4 text-xs text-muted">${legend}</figcaption></figure>`;
}

/* ---------- Detail pages ---------- */
function block(title, body, id) {
  return `<section ${id ? `id="${id}"` : ""} class="scroll-mt-20"><h2 class="eyebrow mb-4">${title}</h2>${body}</section>`;
}
function servicesHtml(groups) {
  return `<div class="space-y-6">${groups.map(g => `<div>
    <h3 class="mb-2 text-sm font-semibold">${esc(g.group)}</h3>
    <div class="card divide-y divide-line">${g.items.map(it => `<details class="group">
      <summary class="flex cursor-pointer list-none flex-col gap-1 px-4 py-3 sm:flex-row sm:items-center sm:justify-between sm:gap-4 [&::-webkit-details-marker]:hidden">
        <span class="flex min-w-0 flex-wrap items-center gap-2"><span class="font-medium group-hover:text-accent">${esc(it.name)}</span>${it.lead ? `<span class="pill">Lead engineer</span>` : ""}${it.live ? `<span class="pill-ok"><span class="h-1.5 w-1.5 rounded-full bg-ok"></span>In production</span>` : ""}</span>
        <span class="flex flex-none items-center gap-3 font-mono text-[11px] text-muted">${esc(it.stack)}<span class="text-base leading-none transition group-open:rotate-45">+</span></span>
      </summary>
      <p class="px-4 pb-4 text-sm leading-6 text-muted">${inline(it.what)}</p>
    </details>`).join("")}</div>
  </div>`).join("")}</div>`;
}
function specTable(rows, stacked) {
  return stacked
    ? `<dl class="divide-y divide-line">${rows.map(r => `<div class="py-2.5"><dt class="text-xs text-muted">${esc(r[0])}</dt><dd class="mt-0.5 text-sm font-medium tabular-nums">${esc(r[1])}</dd></div>`).join("")}</dl>`
    : `<dl class="divide-y divide-line">${rows.map(r => `<div class="flex flex-col gap-0.5 py-2.5 text-sm sm:flex-row sm:justify-between sm:gap-4"><dt class="text-muted">${esc(r[0])}</dt><dd class="font-mono text-[12.5px] tabular-nums sm:text-right">${esc(r[1])}</dd></div>`).join("")}</dl>`;
}
function decisionCard(d, n) {
  return `<li class="card overflow-hidden">
    <div class="flex items-start gap-3 border-b border-line px-5 py-4">
      <span class="mt-0.5 font-mono text-xs text-accent">${String(n).padStart(2, "0")}</span>
      <div class="min-w-0"><p class="font-semibold leading-snug">${esc(d.t)}</p><p class="mt-1 text-sm text-muted"><span class="font-mono text-[11px] uppercase tracking-wider">Instead of</span> ${esc(d.over)}</p></div>
    </div>
    <dl class="grid sm:grid-cols-2">
      <div class="px-5 py-4"><dt class="eyebrow !text-ok">Why</dt><dd class="mt-1.5 text-sm leading-6">${inline(d.why)}</dd></div>
      <div class="border-t border-line bg-sunken/50 px-5 py-4 sm:border-l sm:border-t-0"><dt class="eyebrow">Trade-off accepted</dt><dd class="mt-1.5 text-sm leading-6 text-muted">${inline(d.cost)}</dd></div>
    </dl>
  </li>`;
}
function decisionList(list) {
  return `<ul class="space-y-3">${list.map((d, i) => decisionCard(d, i + 1)).join("")}</ul>`;
}
function impactRow(list) {
  return `<dl class="grid grid-cols-2 gap-3 lg:grid-cols-4">${list.map(x => `<div class="card flex flex-col p-4 sm:p-5"><dt class="order-2 mt-2 text-xs leading-snug text-muted sm:text-[13px]">${esc(x[1])}</dt><dd class="order-1 text-2xl font-semibold leading-none tracking-tight text-accent tabular-nums sm:text-[26px]">${esc(x[0])}</dd></div>`).join("")}</dl>`;
}
function pageTop(back, backLabel) {
  return `<a href="${back}" class="inline-flex items-center gap-1.5 text-sm text-muted hover:text-ink">${I.back} ${backLabel}</a>`;
}

function project(p) {
  const facts = [["Role", p.role], ["Team", p.team], ["Client", p.client], ["When", p.years]].filter(f => f[1]);
  const related = (p.posts || []).map(s => POSTS.concat(EXTERNAL).find(x => x.slug === s)).filter(Boolean);
  const quotes = p.testimonial ? SITE.testimonials.filter(x => x.project === p.slug) : [];
  const idx = SITE.projects.indexOf(p), prev = SITE.projects[idx - 1], next = SITE.projects[idx + 1];
  const host = u => u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
  return `${header("work")}<main id="main" tabindex="-1" class="fade-in gutter py-10 outline-none sm:py-12"><div class="page">
    ${pageTop("#work", "All case studies")}
    <div class="mt-6 flex flex-wrap items-center gap-3"><p class="eyebrow">${esc(p.kind)}</p>${statusPill(p.status)}</div>
    <h1 class="mt-3 text-4xl font-semibold tracking-tight sm:text-5xl">${esc(p.title)}</h1>
    <p class="mt-4 max-w-[64ch] text-lg leading-8 text-muted">${esc(p.summary)}</p>
    <div class="mt-6 flex flex-wrap gap-2.5">
      ${p.site ? `<a href="${esc(p.site)}" target="_blank" rel="noopener" class="btn">${I.out} ${esc(host(p.site))}</a>` : ""}
      ${p.repo ? `<a href="${esc(p.repo)}" target="_blank" rel="noopener" class="btn">${I.gh} View the code</a>` : ""}
    </div>
    ${p.impact ? `<div class="mt-8">${impactRow(p.impact)}</div>` : ""}

    <div class="mt-10 grid gap-10 lg:grid-cols-[minmax(0,1fr)_19rem]">
      <div class="min-w-0 space-y-12">
        ${p.overview ? block("Technical overview", `<div class="prose-p">${p.overview.map(t => `<p>${inline(t)}</p>`).join("")}</div>`) : ""}
        ${p.architecture ? block("Architecture", diagram(p.architecture)) : ""}
        ${p.services ? block(`Services <span class="normal-case tracking-normal">· ${p.services.reduce((n, g) => n + g.items.length, 0)} services and tools, tap one for details</span>`, servicesHtml(p.services)) : ""}
        ${p.decisions ? block("Key decisions and trade-offs", decisionList(p.decisions)) : ""}
        ${quotes.length ? block(quotes[0].doc ? "Client verdict" : "What they said", `<div class="space-y-3">${quotes.map(quoteCard).join("")}</div>`) : ""}
        ${related.length ? block("Related writing", `<ul class="grid gap-3">${related.map(postRow).join("")}</ul>`) : ""}
      </div>
      <aside class="lg:sticky lg:top-20 lg:self-start space-y-4">
        <div class="card p-5"><p class="eyebrow mb-3">Project facts</p>
          <dl class="space-y-3">${facts.map(f => `<div><dt class="text-xs text-muted">${f[0]}</dt><dd class="mt-0.5 text-sm font-medium">${esc(f[1])}</dd></div>`).join("")}</dl>
        </div>
        ${p.scale ? `<div class="card p-5"><p class="eyebrow mb-1">Scale and results</p>${specTable(p.scale, true)}</div>` : ""}
        ${p.stack ? `<div class="card p-5"><p class="eyebrow mb-3">Stack</p><div class="flex flex-wrap gap-1.5">${chips(p.stack)}</div></div>` : ""}
      </aside>
    </div>

    <nav aria-label="More case studies" class="mt-14 grid gap-3 border-t border-line pt-6 sm:grid-cols-2">
      ${prev ? `<a href="#project-${prev.slug}" class="card group p-4 hover:border-accent/60"><span class="eyebrow">Previous</span><span class="mt-1 block font-semibold group-hover:text-accent">${esc(prev.title)}</span></a>` : "<span></span>"}
      ${next ? `<a href="#project-${next.slug}" class="card group p-4 text-right hover:border-accent/60"><span class="eyebrow">Next</span><span class="mt-1 block font-semibold group-hover:text-accent">${esc(next.title)}</span></a>` : ""}
    </nav>
  </div></main>${footer()}`;
}

function caseStudy() {
  const f = SITE.featured, p = SITE.projects.find(x => x.slug === f.project);
  const t = SITE.testimonials.find(x => x.project === f.project);
  const step = (n, title, body) => `<section class="grid gap-4 border-t border-line pt-8 sm:grid-cols-[4rem_minmax(0,1fr)]">
    <p class="font-mono text-sm text-accent">${n}</p><div class="min-w-0"><h2 class="text-xl font-semibold tracking-tight">${title}</h2><div class="mt-4">${body}</div></div></section>`;
  return `${header("accomplishments")}<main id="main" tabindex="-1" class="fade-in gutter py-10 outline-none sm:py-12"><div class="page">
    ${pageTop("#accomplishments", "Accomplishments")}
    <p class="eyebrow mt-6">Case study summary · ${esc(f.when)}</p>
    <h1 class="mt-3 max-w-[22ch] text-4xl font-semibold leading-[1.1] tracking-tight sm:text-5xl">${esc(f.title)}</h1>
    <p class="mt-4 max-w-[64ch] text-lg leading-8 text-muted">${esc(p.title)} for ${esc(p.client)}. ${esc(f.role)}</p>
    <div class="mt-6 flex flex-wrap gap-2.5">
      ${p.site ? `<a href="${esc(p.site)}" target="_blank" rel="noopener" class="btn">${I.out} living.my</a>` : ""}
      ${t && t.doc ? `<a href="${esc(t.doc)}" target="_blank" rel="noopener" class="btn">${I.doc} Letter of Achievement (PDF)</a>` : ""}
    </div>

    <dl class="mt-10 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
      ${f.outcomes.slice(0, 4).map(r => `<div class="card p-4"><dt class="text-xs text-muted">${esc(r[0])}</dt><dd class="mt-1.5 text-sm font-semibold leading-snug">${esc(r[1])}</dd></div>`).join("")}
    </dl>

    <div class="mt-12 grid gap-10 lg:grid-cols-[minmax(0,1fr)_19rem]">
      <div class="min-w-0 space-y-10">
        ${step("01", "Context", `<div class="prose-p">${f.context.map(x => `<p>${inline(x)}</p>`).join("")}</div>`)}
        ${step("02", "Approach", `<ol class="space-y-3">${f.approach.map((x, i) => `<li class="flex gap-3"><span class="mt-0.5 grid h-6 w-6 flex-none place-items-center rounded-full bg-sunken font-mono text-[11px] text-muted">${i + 1}</span><p class="text-[15px] leading-7">${inline(x)}</p></li>`).join("")}</ol>`)}
        ${step("03", "Technical decisions and trade-offs", decisionList(p.decisions))}
        ${step("04", "Outcome", `<div class="prose-p"><p>The platform moved off Azure in three months with the results shown at the top of this page: infrastructure cost down by more than half, no data lost, and Azure kept as a fallback until the new stack was verified.</p></div><p class="mt-4 max-w-[68ch] rounded-lg border border-line bg-surface p-4 text-sm leading-6 text-muted"><b class="font-semibold text-ink">${esc(f.alsoTitle)}.</b> ${esc(f.also)}</p>`)}
        ${step("05", "Architecture after the move", diagram(p.architecture))}
      </div>
      <aside class="lg:sticky lg:top-20 lg:self-start space-y-4">
        ${t ? quoteCard(t) : ""}
        <a href="#project-${p.slug}" class="card group flex items-center justify-between gap-3 p-5 hover:border-accent/60"><span><span class="eyebrow">Full case study</span><span class="mt-1 block font-semibold group-hover:text-accent">${esc(p.title)}</span></span>${I.arrow}</a>
      </aside>
    </div>
  </div></main>${footer()}`;
}

function post(p) {
  return `${header("writing")}<main id="main" tabindex="-1" class="fade-in gutter py-10 outline-none sm:py-12"><div class="mx-auto max-w-[44rem]">
    ${pageTop("#writing", "All writing")}
    <p class="eyebrow mt-6">${fmtDate(p.date)} · ${p.minutes} min read</p>
    <h1 class="mt-3 text-4xl font-semibold tracking-tight">${esc(p.title)}</h1>
    <article class="md mt-8 font-serif text-[17.5px] leading-8 [&_h2]:mt-10 [&_h2]:font-sans [&_h2]:text-2xl [&_h2]:font-semibold [&_h3]:mt-8 [&_h3]:font-sans [&_h3]:font-semibold [&_p]:mb-5 [&_pre]:my-6 [&_pre]:overflow-x-auto [&_pre]:rounded-lg [&_pre]:bg-sunken [&_pre]:p-4 [&_pre]:font-mono [&_pre]:text-[13px] [&_ul]:mb-5 [&_ul]:list-disc [&_ul]:pl-6 [&_ol]:mb-5 [&_ol]:list-decimal [&_ol]:pl-6 [&_a]:text-accent [&_a]:underline">${md(p.body)}</article>
  </div></main>${footer()}`;
}

/* ---------- Router ---------- */
const app = document.getElementById("app");
let homeY = 0, onHome = true;
function render() {
  if (onHome) homeY = window.scrollY;
  const h = decodeURIComponent(location.hash.slice(1));
  let html, anchor = null, t = null;
  if (h.startsWith("project-") && (t = SITE.projects.find(x => x.slug === h.slice(8)))) html = project(t);
  else if (h.startsWith("post-") && (t = POSTS.find(x => x.slug === h.slice(5)))) html = post(t);
  else if (h === "case-study") { html = caseStudy(); t = { title: "Case study" }; }
  else {
    t = null; html = home();
    if (["accomplishments", "outcomes", "awards", "testimonials", "work", "experience", "writing", "education", "about", "contact", "main"].includes(h)) anchor = h;
  }
  app.innerHTML = html;
  const target = anchor && document.getElementById(anchor);
  const nowHome = !t;
  if (target) target.scrollIntoView(); else window.scrollTo(0, nowHome && !h ? homeY : 0);
  onHome = nowHome;
  if (!anchor && h) { const m = document.getElementById("main"); if (m) m.focus({ preventScroll: true }); }
  const top = document.getElementById("to-top");
  if (top) top.addEventListener("click", () => { window.scrollTo({ top: 0 }); const m = document.getElementById("main"); if (m) m.focus({ preventScroll: true }); });
  document.querySelectorAll("details.relative").forEach(d => d.querySelectorAll("a").forEach(a => a.addEventListener("click", () => { d.open = false; })));
  const btn = document.getElementById("copy-email");
  if (btn) btn.addEventListener("click", () => {
    const done = () => { btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy email"), 1600); };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(document.getElementById("email"));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected, copy it now";
    };
    try { navigator.clipboard.writeText(SITE.email).then(done, fallback); } catch (e) { fallback(); }
  });
  document.title = t ? `${t.title} · ${SITE.short}` : `${SITE.short} · ${SITE.title}`;
}
addEventListener("hashchange", render);
addEventListener("click", e => { document.querySelectorAll("details[open]").forEach(d => { if (!d.contains(e.target)) d.open = false; }); });
addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll("details[open]").forEach(d => { d.open = false; d.querySelector("summary")?.focus(); }); });
render();

</script>
</body>
</html>
