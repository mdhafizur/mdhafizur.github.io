<script type="text/markdown" data-slug="traefik-metrics" data-title="The server wasn't slow: reading 22 hours of Traefik metrics" data-date="2026-10-24" data-summary="Users said the platform felt slow. One day of Prometheus data showed an idle server, a noisy 404 page, and a cluster of 500s nobody had noticed.">
After moving a client's platform to a new server, I added Prometheus and Grafana. Traefik exports metrics for every route, cAdvisor covers the containers, node exporter covers the VM, and a Postgres exporter covers the database. The next complaint was "the app feels slow", so instead of guessing I read the first 22 hours of data.

## Start with the machine

If the server is saturated, nothing else matters. It wasn't:

- CPU averaged about 5% of 6 cores. The one spike was the monitoring stack starting up.
- Disk I/O wait averaged about 1%, and steal time from the hypervisor was 0%.
- Postgres never had more than 4 connections, and no query ran longer than 200 ms.

That rules out "we need a bigger server" before anyone spends money on it.

## Then look at latency per route

The overall p95 hides which route is slow, so I broke it down by router:

```promql
histogram_quantile(
  0.95,
  sum by (le, router) (rate(traefik_router_request_duration_seconds_bucket[5m]))
)
```

Typical p95 was 0.1 to 0.5 seconds. Only 83 of about 14,400 requests (0.6%) took longer than a second, and 76 of those were frontend pages. The worst 15-minute windows happened when traffic was nearly zero, so each one was a single slow request, not a general slowdown.

## Count status codes, not just latency

```promql
sum by (router, code) (increase(traefik_router_requests_total[1h]))
```

Two things came out of this that nobody had asked about:

1. **The 404 page was one of the busiest pages.** It was requested hundreds of times a day and took about 0.4 seconds to render, because it ran through the full frontend. A static 404 response would remove that load entirely.
2. **The main API returned 235 HTTP 500 errors in 22 hours**, in three clusters of 49 to 99 errors. Users saw these as "slow" because the page waited and then failed.

## What I took from it

"Slow" is a symptom, not a diagnosis. Check the machine first, break latency down by route, and always look at status codes next to latency. In this case the fix list was two application bugs, not new hardware.
</script>

<script type="text/markdown" data-slug="compose-to-proxmox" data-title="Moving a production Docker Compose stack to Proxmox in a hurry" data-date="2026-10-17" data-summary="The host lost the ability to run Linux containers overnight. How the stack got onto a new server, and what slowed us down.">
A client's production platform went down when its Windows Server VM could no longer run Linux containers (the cause is in [the previous post](#post-nested-virtualization)). The stack was a Docker Compose project: Traefik, a web frontend, a .NET backend image with two API apps, PostgreSQL and MinIO. The goal was simple: get exactly the same stack running on a new server as fast as possible, without losing data.

## 1. Build the target

The new machine was a dedicated server running Proxmox VE, with one public IP. I created one Ubuntu 24.04 VM for the whole stack and put it on a private NAT bridge (`10.10.10.0/24`), with ports 80 and 443 forwarded from the host to the VM. Docker Engine runs natively in the VM, so there's no nested virtualization anywhere.

One VM keeps the move simple. Proxmox makes it cheap to split services later.

## 2. Copy everything, not just the database

The old Docker engine couldn't start, so `pg_dump` wasn't an option. Instead I copied the raw data directories, about 180 GB in total: the repos, the Postgres data directory, roughly 41 GB of MinIO buckets, and the registry images.

```bash
rsync -aH --numeric-ids --info=progress2 old-host:/srv/app/ /srv/app/
```

Postgres had been stopped uncleanly. On first start it replayed its write-ahead log and came up consistent. This works because the whole data directory was copied while nothing was writing to it. Copying a running database's files does not give you the same guarantee.

## 3. Rebuild images from pinned commits

Every image was tagged with the Git commit it was built from, so rebuilding was deterministic:

```bash
git -C ~/repos/backend checkout 21308b5
docker build -t registry.example.com/app/backend:21308b5 ~/repos/backend
```

Watch `pull_policy` in the Compose file. With `always`, Compose checks the registry on every `up`. With `if_not_present`, it uses whatever image with that tag is cached locally. On a moving tag like `latest`, that can keep an old build running without anyone noticing. With commit tags both are safe, because the tag never moves.

One surprise: the MinIO image the stack used was no longer published on Docker Hub or Quay. I built it from source at a pinned release instead.

## 4. Keep the certificates

I copied Traefik's `acme.json` across so it didn't need to re-issue every certificate at once. Traefik refuses to use the file unless only its owner can read it:

```bash
chmod 600 letsencrypt/acme.json
```

## 5. Switch DNS and check every route

The platform had more than 20 DNS records in Cloudflare. I switched each one to the new IP and then opened every route through Traefik to confirm it answered with the right certificate and the right service.

## 6. Fix what made it scary

With production back up, I added what would have made the night easier:

- **Nightly Postgres dumps**, so the next move never depends on copying raw files.
- **Incremental MinIO snapshots** with rsync hard links. Each day looks like a full copy, but unchanged files take no extra space.
- **14 days of retention**, and a small web UI so the client can download a backup without SSH.

```bash
TODAY=$(date +%F)
docker compose exec -T postgres pg_dump -U app -Fc app > /backups/postgres/app-$TODAY.dump
rsync -a --delete --link-dest=/backups/minio/latest /srv/app/minio/ /backups/minio/$TODAY/
ln -sfn /backups/minio/$TODAY /backups/minio/latest
find /backups -mindepth 2 -maxdepth 2 -mtime +14 -exec rm -rf {} +
```

- **Prometheus and Grafana** for Traefik, containers, the VM and Postgres. That paid off within days, as described in [the next post](#post-traefik-metrics).

## What I would tell myself before starting

Pinned images and state kept only in Postgres and MinIO made the move mechanical. The things that cost time were outside the stack: the hypervisor, a disappearing upstream image, and DNS records spread across many hostnames.
</script>

<script type="text/markdown" data-slug="nested-virtualization" data-title="Linux containers on a Windows Server VM: the nested virtualization wall" data-date="2026-10-10" data-summary="Why Docker suddenly stopped running Linux containers on a cloud Windows VM, what the options were, and why we moved to our own hypervisor.">
A client's production stack ran as Linux containers (`linux/amd64`) on a Windows Server 2022 VM. I had moved it there from Azure. I recommended a Linux host at the time, but the client chose Windows because it was familiar to the people who administer it. That's a fair reason. It also meant the containers needed a Linux kernel the operating system didn't have.

## Where the Linux kernel comes from

On Windows, Docker runs Linux containers inside a lightweight Linux VM, through WSL 2 or Hyper-V. Either way, Windows has to start its own virtual machine. That needs the CPU's hardware virtualization extensions (Intel VT-x or AMD-V).

On a physical machine that's a BIOS setting. On a cloud VM, the guest only sees those extensions if the host hypervisor passes them through. That pass-through is called **nested virtualization**.

## What happened

It worked for months. Then the hosting provider turned nested virtualization off across its platform in response to a disclosed KVM vulnerability. After the next restart, Docker could no longer start its Linux engine, and production was down.

Nothing was wrong with the containers, the Compose file, or Docker. The Windows event logs showed the real cause: Hyper-V failing to launch its VM. The missing piece was one layer further down, controlled by someone else.

## The options

1. **Ask the provider to enable it again.** On a Hyper-V host this is a per-VM setting that an administrator changes on the host, with the VM powered off:

```powershell
Set-VMProcessor -VMName <vm-name> -ExposeVirtualizationExtensions $true
```

   You can't change it from inside the guest. Here the provider had disabled it deliberately for security reasons, so it wasn't coming back soon.

2. **Switch to Windows containers.** Only possible if the images are built for Windows. Ours were Linux images, so this would have meant rebuilding the application.

3. **Run Linux directly.** Put the containers on a Linux host, either a Linux VM or a dedicated server where you control the hypervisor.

We chose the third option: a dedicated server running Proxmox, with the stack in an Ubuntu VM. That removes the nesting entirely, and we own the hypervisor if we need more VMs later. The move itself is in [the next post](#post-compose-to-proxmox).

## The lesson

If the workload is Linux containers, put it on Linux. Familiarity with the host OS matters, but every layer you add to bridge the gap is another thing someone else can switch off.
</script>

/* ---------- Markdown (small, escaped) ---------- */
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function inline(s) {
  s = esc(s);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
       .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
       .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
       .replace(/\[([^\]]+)\]\((#[\w-]+)\)/g, '<a href="$2">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + codes[+i] + "</code>");
}
function md(src) {
  const lines = src.replace(/\r/g, "").split("\n");
  const ind = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
  const L = lines.map(l => l.slice(ind));
  let out = [], i = 0;
  while (i < L.length) {
    let line = L[i];
    if (!line.trim()) { i++; continue; }
    let m;
    if (line.trim().startsWith("```")) {
      const buf = []; i++;
      while (i < L.length && !L[i].trim().startsWith("```")) buf.push(L[i++]);
      i++;
      const pad = Math.min(...buf.filter(b => b.trim()).map(b => b.match(/^ */)[0].length), 99);
      out.push("<pre><code>" + esc(buf.map(b => b.slice(pad)).join("\n")) + "</code></pre>");
      continue;
    }
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) {
      const lv = m[1].length >= 3 ? 3 : 2;
      out.push(`<h${lv}>${inline(m[2])}</h${lv}>`); i++; continue;
    }
    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < L.length && /^\s*[-*]\s+/.test(L[i])) items.push("<li>" + inline(L[i++].replace(/^\s*[-*]\s+/, "")) + "</li>");
      out.push("<ul>" + items.join("") + "</ul>"); continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [], start = parseInt(line.trim(), 10);
      while (i < L.length && /^\s*\d+\.\s+/.test(L[i])) {
        items.push("<li>" + inline(L[i++].replace(/^\s*\d+\.\s+/, "")) + "</li>");
        while (i < L.length && !L[i].trim() && L[i + 1] && /^\s*\d+\.\s+/.test(L[i + 1])) i++;
      }
      out.push(`<ol start="${start}">` + items.join("") + "</ol>"); continue;
    }
    if (line.startsWith(">")) {
      const buf = [];
      while (i < L.length && L[i].startsWith(">")) buf.push(L[i++].replace(/^>\s?/, ""));
      out.push("<blockquote>" + inline(buf.join(" ")) + "</blockquote>"); continue;
    }
    const buf = [L[i++].trim()];
    while (i < L.length && L[i].trim() && !/^(#{1,3}\s|```|>|[-*]\s|\d+\.\s)/.test(L[i].trim())) buf.push(L[i++].trim());
    out.push("<p>" + inline(buf.join(" ")) + "</p>");
  }
  return out.join("\n");
}

function nodeHtml(n) {

function diagram(a) {
  const bs = a.boundaries || (a.boundary ? [a.boundary] : []);
  const link = t => `<div class="link-down" aria-hidden="true">${t.link ? `<span>${esc(t.link)}</span>` : ""}</div>`;
  const tier = t => `<div class="tier">${t.nodes.map(nodeHtml).join("")}</div>`;
  let html = "";
  a.tiers.forEach((t, i) => {
    const opening = bs.filter(b => b.from === i);
    if (i) html += link(t);
    opening.forEach(b => { html += `<div class="boundary"><span class="boundary-label">${esc(b.label)}</span>`; });
    html += tier(t);
    bs.filter(b => b.to === i).forEach(() => { html += `</div>`; });
  });
  const kinds = new Set(a.tiers.flatMap(t => t.nodes.map(n => n[2] || "plain")));
  const legend = [["core", "Built by me"], ["plain", "Platform component"], ["store", "Data store"], ["ext", "Outside the system"]]
    .filter(k => kinds.has(k[0])).map(k => `<span><i class="l-${k[0]}"></i>${k[1]}</span>`).join("");
  const desc = a.tiers.map(t => t.nodes.map(n => n[0]).join(", ")).join(", then ");
  return `<div class="arch-frame"><div class="arch" role="img" aria-label="Architecture, top to bottom: ${esc(desc)}">${html}</div>
    <div class="legend">${legend}</div></div>`;
}

/* ---------- Router ---------- */
const app = document.getElementById("app");
function render() {
  const h = decodeURIComponent(location.hash.slice(1));
  let html, anchor = null, t = null;
  if (h.startsWith("project-") && (t = SITE.projects.find(x => x.slug === h.slice(8)))) {
    html = project(t);
  } else if (h.startsWith("post-") && (t = POSTS.find(x => x.slug === h.slice(5)))) {
    html = post(t);
  } else {
    t = null;
    html = home();
    if (["work", "experience", "writing", "education", "about"].includes(h)) anchor = h;
  }
  app.innerHTML = html;
  const target = anchor && document.getElementById(anchor);
  if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  const btn = document.getElementById("copy-email");
  if (btn) btn.addEventListener("click", () => {
    const done = () => { btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy email", 1600); };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(document.getElementById("email"));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected, press Ctrl+C";
    };
    try { navigator.clipboard.writeText(SITE.email).then(done, fallback); } catch (e) { fallback(); }
  });
  document.title = t ? `${t.title} · ${SITE.short}` : SITE.short;
}
addEventListener("hashchange", render);
render();
